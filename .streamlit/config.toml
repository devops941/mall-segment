# KZ-ML-03 Mall Customer Segmentation — vibrant locked light theme

[theme]
base = "light"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["30px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]
codeFontSize = "0.85rem"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "0.75rem"
paddingBottom = "2rem"

primaryColor = "#7C3AED"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F0E9FF"
textColor = "#1A1033"
linkColor = "#7C3AED"
borderColor = "#D8B4FE"
codeTextColor = "#6D28D9"
codeBackgroundColor = "#EDE9FE"

redColor    = "#EF4444"
orangeColor = "#F97316"
yellowColor = "#EAB308"
greenColor  = "#22C55E"
blueColor   = "#3B82F6"
violetColor = "#7C3AED"
grayColor   = "#6B7280"

# Chart palettes — aligned with PALETTE in utils/ui.py
chartCategoricalColors = [
    "#EF4444",
    "#3B82F6",
    "#22C55E",
    "#F97316",
    "#7C3AED",
    "#06B6D4",
    "#EC4899",
    "#EAB308",
]
chartSequentialColors = [
    "#F5F3FF",
    "#EDE9FE",
    "#DDD6FE",
    "#C4B5FD",
    "#A78BFA",
    "#8B5CF6",
    "#7C3AED",
    "#6D28D9",
    "#5B21B6",
    "#4C1D95",
]

dataframeBorderColor          = "#D8B4FE"
dataframeHeaderBackgroundColor = "#7C3AED"
dataframeHeaderTextColor       = "#FFFFFF"

metricValueFontSize   = "2rem"
metricValueFontWeight = 700

[theme.sidebar]
backgroundColor          = "#1A1033"
secondaryBackgroundColor = "#2D1B5C"
codeBackgroundColor      = "#2D1B5C"
textColor                = "#F5F3FF"
borderColor              = "#4C1D95"
primaryColor             = "#A78BFA"
linkColor                = "#C4B5FD"
showWidgetBorder         = true
paddingTop               = "0.5rem"
paddingBottom            = "1.5rem"
