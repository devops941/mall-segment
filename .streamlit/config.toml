# KZ-ML-03 Mall Customer Segmentation — Clean Modern Light Theme

[theme]
base = "light"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "15px", "13px", "12px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]
codeFontSize = "0.85rem"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "2rem"
paddingBottom = "2rem"

primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
linkColor = "#4F46E5"
borderColor = "#E2E8F0"
codeTextColor = "#4338CA"
codeBackgroundColor = "#F1F5F9"

redColor    = "#EF4444"
orangeColor = "#F97316"
yellowColor = "#EAB308"
greenColor  = "#10B981"
blueColor   = "#3B82F6"
violetColor = "#6366F1"
grayColor   = "#64748B"

# Chart palettes
chartCategoricalColors = [
    "#4F46E5",
    "#06B6D4",
    "#10B981",
    "#F59E0B",
    "#EC4899",
    "#8B5CF6",
    "#3B82F6",
    "#14B8A6",
]
chartSequentialColors = [
    "#EEF2FF",
    "#E0E7FF",
    "#C7D2FE",
    "#A5B4FC",
    "#818CF8",
    "#6366F1",
    "#4F46E5",
    "#4338CA",
    "#3730A3",
    "#312E81",
]

dataframeBorderColor          = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"
dataframeHeaderTextColor       = "#0F172A"

metricValueFontSize   = "1.9rem"
metricValueFontWeight = 700

[theme.sidebar]
backgroundColor          = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
codeBackgroundColor      = "#F1F5F9"
textColor                = "#0F172A"
borderColor              = "#E2E8F0"
primaryColor             = "#4F46E5"
linkColor                = "#4F46E5"
showWidgetBorder         = true
paddingTop               = "0.5rem"
paddingBottom            = "1.5rem"
